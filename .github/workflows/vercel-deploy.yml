name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_uYgw5FW74oExVNMObREuL5K9
          vercel-project-id: prj_I03oSqCaUgVFmL4OCcKuU5m2DQra
          working-directory: .
          target: production
          github-comment: false
